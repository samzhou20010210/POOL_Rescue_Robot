# Parameters for trajectory_generator_node (rov_planning, implementation
# steps 8B and 9): online planning with 5 Hz replanning, failure handling,
# brake and hold, and the swimmer check. See the node's header comment.

trajectory_generator_node:
  ros__parameters:
    # Victim state for targets on "victim_target" (PointStamped): "submerged"
    # or "surface" ("victim" messages carry their own state). Surface targets
    # get the 0.3 m/s final-zone cap within 2 m (design 3 item 5).
    victim_state: submerged
    # true: plan and report, but do not send the trajectory.
    dry_run: false

    map_frame: map
    base_frame: base_link

    # Nav2 A* (planner_server, NavFn with use_astar: true).
    planner_id: GridBased
    planner_timeout_sec: 5.0          # s; > 0

    # FIRI corridor for base_link (rov_planning corridor_2d).
    # Clearance from blocked cells to the robot centre: stowed outline corner
    # radius ~0.79 m + 0.5 m wall clearance is ~1.3 m; 1.2 m because A*
    # (robot_radius 1.3 m, measured to cell centres) already keeps paths away
    # and the corridor measures to cell edges. Provisional.
    corridor_clearance_m: 1.2
    corridor_seed_spacing_m: 1.0      # delta_s (design 6.5)
    corridor_max_polygons: 30         # N_poly (design 6.5)
    corridor_bounding_margin_m: 3.0   # how far a polygon may reach beyond its seed

    # Trajectory message: one point every sample_period_s seconds; > 0.
    sample_period_s: 0.05

    # Check at the reached pose: simulation acceptance limits (design 1, 6.5;
    # not controller tolerances), plus the separate clearance check.
    acceptance_position_m: 0.25
    acceptance_yaw_rad: 0.15

    # Replanning while a trajectory executes (design 3 item 6), one attempt at a time.
    replan_enabled: true
    replan_rate_hz: 5.0               # f_replan (design 6.5), Hz; > 0
    # Immediate replan when the controller's tracking error exceeds this, m
    # (design 6.5: e_replan); the replan starts from the measured state.
    tracking_error_replan_m: 0.5
    # A target more than this from the current victim triggers a replan, m
    # (design 6.5: target-shift threshold dp_v); > 0.
    replan_target_shift_m: 0.3
    # Handoff this far ahead of "now" on the active trajectory, s. Must cover
    # A* + corridor + warm MINCO + dispatch (~0.1-0.2 s measured); provisional.
    replan_handoff_lead_s: 0.6
    # The replacement must be ready at least this long before the handoff, s
    # (time for the controller to receive it); provisional; >= 0.
    replan_dispatch_margin_s: 0.1
    # No replan if the active trajectory ends within this after the handoff, s;
    # provisional; >= 0.
    replan_min_remaining_s: 1.0

    # Failure handling (design 3 item 7): retry at retry_speed_factor * v_cruise;
    # after max_consecutive_failures in a row, brake to a stop and hold, then
    # retry every retry_period_s. A goal that never got a trajectory is
    # rejected after the same number of failures.
    max_consecutive_failures: 3       # >= 1
    retry_speed_factor: 0.7           # fraction of v_cruise; 0 < f <= 1
    retry_period_s: 1.0               # s; > 0; provisional
    # Victim target updates older than this are ignored (stale), s; > 0;
    # provisional (shore updates arrive at 30 Hz, design 6.4).
    target_max_age_s: 1.0
    # Test hook: the next N planning attempts fail as optimizer failures
    # (settable at run time with "ros2 param set"). 0 in normal use.
    force_optimizer_failures: 0

    # Swimmer check (step 9): before any FollowTrajectory goal is sent, the
    # stowed hull outline along its time-stamped points must stay outside every
    # swimmer's predicted disc at the same time (tracks on "swimmer_tracks").
    # true | false; false only for tests without swimmers.
    swimmer_check_enabled: true

    # Parameter files. Empty = the installed defaults:
    #   rov_planning/config/terminal_pose.yaml,
    #   rov_planning/config/surface_trajectory_optimizer.yaml,
    #   rov_control/config/thrust_allocator.yaml (planning limits are checked against it),
    #   rov_description/config/hydrodynamics_v4.yaml and thrusters_v4.yaml,
    #   rov_planning/config/swimmer_prediction.yaml (also used by the swimmer layer).
    terminal_pose_file: ""
    optimizer_file: ""
    allocator_file: ""
    hydrodynamics_file: ""
    thruster_config_file: ""
    swimmer_prediction_file: ""
