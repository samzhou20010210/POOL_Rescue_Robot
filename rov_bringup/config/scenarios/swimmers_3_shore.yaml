# Fake shore swimmers for scenario swimmers_3_shore (rov_simulation fake_shore_node).
# Swimmers 1 and 2 as in swimmers_2; swimmer 3 swims back and forth across the route 5 m along it (6 m legs at 0.4 m/s) for 25 s.
# Route: start map (-20.0, -7.5) -> terminal pose (-1.08, -0.40), direction
# (0.936, 0.351); swimmers move across it (normal (-0.351, 0.936)).
# Inactive until the scenario runner sets active:=true together with the
# target, so swimmer times count from the target (s).

fake_shore_node:
  ros__parameters:
    active: false
    publish_rate_hz: 10.0      # f_swim (design 6.4), Hz
    frame_id: map
    position_noise_m: 0.05     # sigma_shore (design 6.4), m
    velocity_noise_mps: 0.05   # m/s; provisional
    random_seed: 42
    swimmer_ids: [1, 2, 3]
    swimmer_motions: ["straight", "straight", "back_and_forth"]
    swimmer_start_x: [-9.232, -6.189, -14.265]          # m
    swimmer_start_y: [-7.734, 4.087, -8.553]          # m
    swimmer_velocity_x: [-0.176, 0.211, -0.140]      # m/s
    swimmer_velocity_y: [0.468, -0.562, 0.375]      # m/s
    swimmer_travel_m: [0.000, 0.000, 6.000]    # m (back_and_forth leg)
    swimmer_start_time_s: [0.000, 0.000, 0.000] # s after activation
    swimmer_lifetime_s: [20.000, 22.000, 25.000]    # s
