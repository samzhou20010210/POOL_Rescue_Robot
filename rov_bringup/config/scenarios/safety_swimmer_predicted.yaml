# Step 10 safety test (design 5): Swimmer rule 'predicted swimmer within 1.0 m: stop, hold, replan'. A fast swimmer heads
# towards the robot along the route and its track ends 3 s later.
# Expected: the rule triggers once and produces its specified action.

base: mission_submerged
name: safety_swimmer_predicted
description: Safety rule test safety_swimmer_predicted.
launch:
  arguments:
    swimmers: "true"
    swimmer_config: safety_swimmer_predicted_shore.yaml

events:
  - at_s: 0.0
    actions:
      - shore_alarm: {x: 0.0, y: 0.0, state: submerged}
  - at_s: 4.0
    actions:
      - set_param: {node: fake_shore_node, name: active, value: true}
  - on_phase: DIVE_AND_GRASP
    delay_s: 3.0                                          # s
    actions:
      - mission_event: {type: rescue_complete, detail: "victim lifted (simulated)"}

expect:
  safety_rules: [swimmer_predicted]
  phases: [TRANSIT, SAFETY_STOP, TRANSIT, FINAL_APPROACH, DIVE_AND_GRASP, RETURN, STANDBY]
  reports_present:
    - "SAFETY TRIGGER swimmer_predicted: .*stop, hold, replan"
    - "^BRAKING"
  reports_absent: []
  limits:
    min_swimmer_distance_m: {min: 1.0}   # r_swim
