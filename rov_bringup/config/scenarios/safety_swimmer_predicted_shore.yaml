# Fake shore swimmer for safety_swimmer_predicted (on the route 14 m from the start, swimming towards the robot at 1.5 m/s for 3 s).
# Inactive until the scenario activates it; times count from activation (s).

fake_shore_node:
  ros__parameters:
    active: false
    publish_rate_hz: 10.0      # Hz
    frame_id: map
    position_noise_m: 0.05     # m
    velocity_noise_mps: 0.05   # m/s; provisional
    random_seed: 42
    swimmer_ids: [1]
    swimmer_motions: ["straight"]
    swimmer_start_x: [-6.891]   # m
    swimmer_start_y: [-2.584]   # m
    swimmer_velocity_x: [-1.404]   # m/s
    swimmer_velocity_y: [-0.527]   # m/s
    swimmer_travel_m: [0.0]     # m
    swimmer_start_time_s: [0.0]   # s
    swimmer_lifetime_s: [3.0]    # s
