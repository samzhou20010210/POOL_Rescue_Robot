# Step 10 safety test (design 5): Rule 'heartbeat still lost 5.0 s: abort, hold, wait for manual takeover'. The heartbeat
# stops for good 6 s into the transit; 4 s after the abort an operator takes over.
# Expected: the rule triggers once and produces its specified action.

base: mission_submerged
name: safety_heartbeat_abort
description: Safety rule test safety_heartbeat_abort.

events:
  - at_s: 0.0
    actions:
      - shore_alarm: {x: 0.0, y: 0.0, state: submerged}
  - at_s: 6.0
    actions:
      - set_param: {node: fake_shore_node, name: heartbeat_enabled, value: false}
  - after_report: "SAFETY TRIGGER heartbeat_abort"
    delay_s: 4.0
    actions:
      - mission_event: {type: manual_takeover, detail: "operator takes over"}
end:
  phase: STANDBY
  after_phase: SAFETY_STOP

expect:
  status: ""              # no arrival: the mission is aborted
  reason: ""
  limits: {}
  safety_rules: [heartbeat_lost, heartbeat_abort]
  phases: [TRANSIT, SAFETY_STOP, STANDBY]
  reports_present:
    - "SAFETY TRIGGER heartbeat_abort: .*abort, hold, wait for manual takeover"
    - "^MISSION .*-> SAFETY_STOP \\(abort"
    - "^MISSION .*SAFETY_STOP -> STANDBY \\(manual takeover"
  reports_absent: []
