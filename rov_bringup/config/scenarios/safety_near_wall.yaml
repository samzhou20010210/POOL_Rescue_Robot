# Step 10 safety test (design 5): rule 'hull edge within 0.5 m of a pool
# wall: speed limit 0.3 m/s'.
# Finding: with the documented parameters the rule cannot be exercised in
# motion. It needs base_link within ~1.0 m of a wall, but A* (Nav2, robot
# radius 1.3 m) never plans closer than 1.3 m, and cannot plan from such a
# start. The vehicle therefore starts with its stern 0.45 m from the west
# wall: the monitor must trigger near_wall (speed limit 0.3 m/s in
# safety_status), and the approach from there is refused by A*.

base: mission_submerged
name: safety_near_wall
description: Near-wall rule triggers at a start 0.45 m from the wall (A* cannot plan from it).

launch:
  arguments:
    start_x: "0.95"       # m, pool world frame (= map -24.05)
    start_y: "5.0"        # m, pool world frame (= map -7.5)
    start_yaw: "0.0"      # rad

timeouts:
  run_s: 30.0             # s

events:
  - at_s: 0.0
    actions:
      - shore_alarm: {x: 0.0, y: 0.0, state: submerged}   # m, map frame

end:
  report: "^REJECTED"

expect:
  status: rejected
  reason: "A\\* found no path"
  safety_rules: [near_wall]
  phases: [TRANSIT]
  reports_present: []
  reports_absent: ["^PLANNED"]
  limits: {}
  required_topics:
    /safety_status: 10
