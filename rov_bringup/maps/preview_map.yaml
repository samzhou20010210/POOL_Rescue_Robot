# Small test map for the planning preview (10 m x 10 m, 5 cm per pixel).
# - A wall at x = 2 m blocks the straight line from the start (0, 0)
#   to the reachable goal (4, 0).
# - A closed box around (6, 3) makes that goal unreachable.
image: preview_map.pgm
mode: trinary
resolution: 0.05
origin: [-2.0, -5.0, 0.0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
